name: Cross-Platform CMake Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - { name: "Windows (MSVC)", os: windows-latest, generator: "Ninja" }
          - { name: "Linux (GCC)", os: ubuntu-latest, generator: "Ninja" }
          - { name: "macOS (Clang)", os: macos-latest, generator: "Ninja" }

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Ninja (Linux & macOS)
        if: runner.os != 'Windows'
        run: |
          if [ "${{ runner.os }}" == "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y ninja-build
          elif [ "${{ runner.os }}" == "macOS" ]; then
            brew install ninja
          fi

      - name: Configure CMake
        run: cmake -S ${{github.workspace}} -B ${{github.workspace}}/build -G "${{ matrix.config.generator }}" -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build ${{github.workspace}}/build --config Release --parallel
